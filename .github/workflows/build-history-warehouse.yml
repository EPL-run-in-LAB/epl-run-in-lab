name: Build CC0 football history warehouse

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-history-warehouse.yml"
      - "scripts/build_history_warehouse.py"
      - "tests/test_history_warehouse.py"
      - "data/history/snapshots/**"

permissions:
  contents: write

concurrency:
  group: historical-warehouse
  cancel-in-progress: false

jobs:
  build-history:
    runs-on: ubuntu-latest
    steps:
      - name: Check out historical snapshots
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated SQLite import tests
        run: python -m unittest discover -s tests -p 'test_history_warehouse.py' -v
      - name: Build independent warehouse
        run: python scripts/build_history_warehouse.py
      - name: Validate complete five-season coverage
        run: |
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          report = json.loads(Path("data/history/validation_report.json").read_text(encoding="utf-8"))
          assert report["totals"]["matches"] == 7008, report["totals"]
          assert report["totals"]["eligible"] == 7007, report["totals"]
          assert report["totals"]["cc0_json_array"] == 87, report["totals"]
          assert report["totals"]["cc0_upstream_text"] == 20, report["totals"]
          assert report["totals"]["official_decision"] == 1, report["totals"]
          with sqlite3.connect("data/history/history.sqlite") as db:
              assert db.execute("SELECT COUNT(*) FROM matches").fetchone()[0] == 7008
              assert db.execute("PRAGMA foreign_key_check").fetchall() == []
              assert db.execute("SELECT COUNT(*) FROM seasons").fetchone()[0] == 20
          print("Verified 7,008 fixtures in 20 season snapshots.")
          PY
      - name: Persist validated database and quality report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/history.sqlite data/history/validation_report.json
          if git diff --cached --quiet; then
            echo "No history warehouse changes."
          else
            git commit -m "data: persist validated five-season history warehouse [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
