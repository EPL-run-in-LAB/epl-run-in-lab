name: Collect cup schedules and results (isolated)
on:
  workflow_dispatch:
  schedule:
    - cron: "35 21 * * *"
permissions:
  contents: write
concurrency:
  group: cup-data-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Run offline validation
        run: python -m unittest discover -s tests -p 'test_competition_schedule.py' -v
      - name: Validate congestion calculations
        run: python -m unittest discover -s tests -p 'test_fixture_congestion.py' -v
      - name: Collect cup schedule and result archive
        run: python scripts/update_competition_schedule.py
      - name: Generate fixture congestion dataset
        run: python scripts/build_fixture_congestion.py
      - name: Persist cup datasets only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/competition_schedule.json docs/data/competition_results_archive.json docs/data/competition_validation_report.json docs/data/fixture_congestion.json
          if git diff --cached --quiet; then
            echo "No new cup data"
          else
            git commit -m "data: update cup fixtures and results [skip ci]"
            git push
          fi
