name: Update EPL predictions and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "10 21 * * *"
  push:
    branches: ["main"]
    paths-ignore:
      - "data/history/**"
      - "data/performance/**"
      - "tests/**"
      - "scripts/build_history_warehouse.py"
      - "scripts/build_uefa_history.py"
      - "scripts/build_team_competition_analysis.py"
      - ".github/workflows/build-history-warehouse.yml"
      - ".github/workflows/evaluate-predictions.yml"
      - ".github/workflows/validate-competition-schedule.yml"
  workflow_run:
    workflows: ["Collect cup schedules and results (isolated)"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{
        (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')) &&
        (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate immutable match identity and unresolved dates
        run: python -m unittest discover -s tests -p 'test_integrity_priorities.py' -v
      - name: Update predictions, archive matches and build pages
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: |
          python scripts/update_predictions.py
          python scripts/update_match_archive.py
          python scripts/evaluate_prediction_archive.py --out docs/data/forecast_accuracy.json
          python scripts/build_fixture_congestion.py
          python scripts/build_i18n.py
      - name: Validate Pages fixture congestion dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/fixture_congestion.json')
          assert p.is_file(), 'fixture_congestion.json is missing'
          d=json.loads(p.read_text(encoding='utf-8'))
          assert len(d.get('teams',{})) == 20, 'Expected 20 EPL clubs'
          assert all('matches' in v for v in d['teams'].values())
          en=Path('docs/en/congestion.html').read_text(encoding='utf-8')
          assert "fetch('../data/fixture_congestion.json'" in en, 'English page JSON path is broken'
          ko=Path('docs/congestion.html').read_text(encoding='utf-8')
          assert "fetch('./data/fixture_congestion.json'" in ko, 'Korean page JSON path is broken'
          accuracy=json.loads(Path('docs/data/forecast_accuracy.json').read_text(encoding='utf-8'))
          sample=accuracy['sample']
          assert sample['eligibleFinalizedFixtures'] > 0, 'No eligible completed predictions'
          assert len(accuracy['fixtures']) == sample['eligibleFinalizedFixtures']
          assert sample['teamAppearances'] == 2*sample['eligibleFinalizedFixtures']
          assert 0 <= accuracy['results']['top1Accuracy'] <= 1
          assert Path('docs/accuracy.html').is_file()
          assert Path('docs/en/accuracy.html').is_file()
          sitemap=Path('docs/sitemap.xml').read_text(encoding='utf-8')
          assert '/accuracy.html' in sitemap and '/en/accuracy.html' in sitemap
          print('Fixture congestion and forecast-accuracy dashboard routes verified.')
          PY
      - name: Validate accuracy dashboard JavaScript and bilingual HTML
        run: |
          node --check docs/assets/site-shell.js
          node --check docs/assets/accuracy-dashboard.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Ids(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  attr = dict(attrs)
                  if 'id' in attr:
                      if attr['id'] in self.ids: raise AssertionError('Duplicate element id: '+attr['id'])
                      self.ids.add(attr['id'])
          required = {'menuBtn','sidebar','overlay','accCount','accAccuracy','accBrier',
                      'accLoss','accBrier2','accLoss2','accCountNote','accDates','accLimit',
                      'accBaseBrier','accBaseLoss','accBaseHome','accStatus','accTeamRows',
                      'accCalibrationRows','accTeamFilter','accHitFilter','accFixtureRows',
                      'accFixtureCount','accNoFixtures','accShowMore','accFixtureSection'}
          for lang,path,src in [('ko','docs/accuracy.html','./assets/accuracy-dashboard.js'),
                                ('en','docs/en/accuracy.html','../assets/accuracy-dashboard.js')]:
              text = Path(path).read_text(encoding='utf-8')
              parser = Ids()
              parser.feed(text)
              assert not (required - parser.ids), (lang,sorted(required - parser.ids))
              assert '<html lang="'+lang+'">' in text
              assert 'src="'+src+'"' in text
              assert 'href="./accuracy.html"' in text
              assert 'aria-current="page"' in text
          print('Bilingual accuracy dashboard markup and JavaScript syntax verified.')
          PY
      - name: Persist immutable pre-match snapshots
        run: |
          if [ -z "$(git status --porcelain -- docs/data/match_archive.json)" ]; then
            echo "No archive changes to persist."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/match_archive.json
            git commit -m "chore: persist match snapshots [skip ci]"
            # Keep uncommitted generated Pages assets while rebasing the saved snapshot.
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
