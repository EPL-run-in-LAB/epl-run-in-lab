name: Update EPL predictions and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "10 21 * * *"
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update predictions, archive matches and build pages
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: |
          python scripts/update_predictions.py
          python scripts/update_match_archive.py
          python scripts/build_i18n.py
      - name: Persist immutable pre-match snapshots
        run: |
          if [ -z "$(git status --porcelain -- docs/data/match_archive.json)" ]; then
            echo "No archive changes to persist."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/match_archive.json
            git commit -m "chore: persist match snapshots [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
