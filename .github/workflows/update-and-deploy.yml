name: Update EPL predictions and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "10 21 * * *"
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Collect cup schedules and results (isolated)"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{
        (github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]')) &&
        (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update predictions, archive matches and build pages
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: |
          python scripts/update_predictions.py
          python scripts/update_match_archive.py
          python scripts/build_fixture_congestion.py
          python scripts/build_i18n.py
      - name: Validate Pages fixture congestion dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/fixture_congestion.json')
          assert p.is_file(), 'fixture_congestion.json is missing'
          d=json.loads(p.read_text(encoding='utf-8'))
          assert len(d.get('teams',{})) == 20, 'Expected 20 EPL clubs'
          assert all('matches' in v for v in d['teams'].values())
          en=Path('docs/en/congestion.html').read_text(encoding='utf-8')
          assert "fetch('../data/fixture_congestion.json'" in en, 'English page JSON path is broken'
          ko=Path('docs/congestion.html').read_text(encoding='utf-8')
          assert "fetch('./data/fixture_congestion.json'" in ko, 'Korean page JSON path is broken'
          print('Fixture calendar and locale routes are ready for deployment.')
          PY
      - name: Persist immutable pre-match snapshots
        run: |
          if [ -z "$(git status --porcelain -- docs/data/match_archive.json)" ]; then
            echo "No archive changes to persist."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/match_archive.json
            git commit -m "chore: persist match snapshots [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
