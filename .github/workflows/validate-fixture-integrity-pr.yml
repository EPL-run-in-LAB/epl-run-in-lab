name: Validate fixture integrity PR (isolated)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/update_match_archive.py"
      - "scripts/update_predictions.py"
      - "scripts/enrich_schedule_integrity.py"
      - "scripts/audit_epl_kickoffs.py"
      - "scripts/build_cross_team_schedule_context.py"
      - "tests/test_integrity_priorities.py"
      - "tests/test_epl_kickoff_audit.py"
      - ".github/workflows/validate-fixture-integrity-pr.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Compile changed scripts
        run: python -m compileall -q scripts/update_match_archive.py scripts/update_predictions.py scripts/enrich_schedule_integrity.py scripts/build_cross_team_schedule_context.py scripts/audit_epl_kickoffs.py tests/test_integrity_priorities.py tests/test_epl_kickoff_audit.py
      - name: Unit tests for exact fixture identity and quarantine
        run: python -m unittest discover -s tests -p 'test_integrity_priorities.py' -v
      - name: Unit tests for independent EPL date corroboration
        run: python -m unittest discover -s tests -p 'test_epl_kickoff_audit.py' -v
      - name: Audit EPL kickoff against available independent authenticated feed
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          if [ -n "$FOOTBALL_DATA_TOKEN" ]; then
            python scripts/audit_epl_kickoffs.py --out /tmp/epl_kickoff_crosscheck_2627.json
          else
            echo "No FOOTBALL_DATA_TOKEN available; skipped authorized read-only validation."
          fi
      - name: Exercise NL/PT fixture collection and date audit (no model impact)
        run: python scripts/enrich_schedule_integrity.py --output /tmp/extended_domestic_2627.json --audit /tmp/date_conflict_audit_2627.json
      - name: Rebuild UEFA context with extended leagues and verify improvement
        run: |
          cp /tmp/extended_domestic_2627.json data/live/extended_domestic_2627.json
          python scripts/build_cross_team_schedule_context.py --out /tmp/uefa_rest_context_extended.json
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path("data/live/uefa_rest_context_2627.json").read_text())["coverage"]
          after=json.loads(Path("/tmp/uefa_rest_context_extended.json").read_text())["coverage"]
          print("UEFA coverage before:",before,"after:",after)
          assert after["uefaFixtures"]==396
          assert after["bothDomesticSchedules"]>=before["bothDomesticSchedules"]
          assert after["oneDomesticSchedule"]+after["bothDomesticSchedules"]>=before["oneDomesticSchedule"]+before["bothDomesticSchedules"]
          PY
      - name: Offline full-season EPL probability generation regression
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from update_predictions import generate, canonical
          source=json.loads(Path("data/live/current_schedule_2627.json").read_text())
          league=[m for m in source["matches"] if m["competition"]=="EN1"]
          assert len(league)==380
          payload={"matches":[]}
          for i,m in enumerate(league):
              score=m.get("score")
              payload["matches"].append({
                  "id":900000+i,"utcDate":m["date"]+"T15:00:00Z",
                  "homeTeam":{"name":m["home"]},"awayTeam":{"name":m["away"]},
                  "status":"FINISHED" if score is not None else "SCHEDULED",
                  "score":{"fullTime":{"home":score[0] if score else None,"away":score[1] if score else None}}
              })
          result=generate(payload)
          n=sum(g["status"]=="SCHEDULED" for g in payload["matches"])
          assert len(result["games"])==20
          assert len(result["allRemainingFixtures"])==n
          assert len(result["fixtureSnapshots"])==n
          assert all(len(g)<=10 for g in result["games"].values())
          assert all(0.999999<=m["homeWin"]+m["draw"]+m["awayWin"]<=1.000001 for m in result["allRemainingFixtures"])
          assert all("homeFactors" in m and "awayFactors" in m for m in result["fixtureSnapshots"])
          assert all("homeFactors" not in m for m in result["allRemainingFixtures"])
          print("EPL full season regression:",len(league),"total,",n,"remaining, snapshots",len(result["fixtureSnapshots"]))
          PY
      - name: Gate consistency and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ext=json.loads(Path("/tmp/extended_domestic_2627.json").read_text())
          a=json.loads(Path("/tmp/date_conflict_audit_2627.json").read_text())
          print("Coverage:", ext["coverage"])
          print("Conflict totals:", a["unresolvedCount"], a["byStatus"])
          assert a["unresolvedCount"] == len(a["issues"])
          assert all(not i["dateVerified"] and i["kickoffVerifiedUTC"] is None for i in a["issues"])
          for comp,info in ext["coverage"].items():
              if info["status"]=="COMPLETE_SOURCE_UNVERIFIED_DATES":
                  assert len([m for m in ext["matches"] if m["competition"]==comp])==306
          assert len(a["issues"]) > 0
          PY
